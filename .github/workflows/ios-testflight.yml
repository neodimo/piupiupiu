name: iOS TestFlight

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install Godot + iOS export templates
        run: |
          set -e
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -L -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          sudo mv Godot.app /Applications/Godot.app
          echo "/Applications/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"
          curl -L -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TDIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TDIR"
          mv templates/* "$TDIR/"

      - name: Export Godot iOS Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          # Godot requires the team id in the preset even for project-only export.
          sed -i '' "s|application/app_store_team_id=\"\"|application/app_store_team_id=\"${APPLE_TEAM_ID}\"|" export_presets.cfg
          # Unique, monotonically-increasing build number so TestFlight never sees a duplicate.
          sed -i '' "s|application/version=\"1\"|application/version=\"${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          mkdir -p build/ios
          Godot --headless --path . --import
          Godot --headless --path . --export-release "iOS" build/ios/piupiupiu.xcodeproj

      - name: Dump exported Info.plist (compatibility metadata)
        run: |
          set -e
          echo "== Info.plist files under build/ios =="
          find build/ios -name "*Info.plist" -print
          for p in $(find build/ios -name "*Info.plist"); do
            echo "===== $p ====="
            plutil -p "$p" | grep -Ei "MinimumOSVersion|UIDeviceFamily|UIRequiredDeviceCapabilities|CFBundleShortVersion|CFBundleVersion|arm64|metal" || plutil -p "$p"
          done

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build + upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install bundler >/dev/null
          bundle install
          bundle exec fastlane ios beta

      - name: Keep IPA for inspection
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: piupiupiu-ipa
          path: |
            **/*.ipa
          if-no-files-found: warn
          retention-days: 2
